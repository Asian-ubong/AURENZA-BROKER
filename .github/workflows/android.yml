name: AURENZA BROKER - Build Signed Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build AURENZA Android APK
    runs-on: ubuntu-latest

    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

    steps:
      - name: Checkout AURENZA
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          java -version

      - name: Generate Android platform files when missing
        run: |
          if [ ! -d android ]; then
            flutter create \
              --platforms=android \
              --project-name=aurenza_broker \
              --org=com.example \
              .
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Format Dart source
        run: dart format lib test

      - name: Analyze Dart source
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Prepare signing configuration
        run: |
          mkdir -p android/app

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "KEYSTORE_PASSWORD is missing"
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "KEY_PASSWORD is missing"
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "KEY_ALIAS is missing"
            exit 1
          fi

          echo "Generating release keystore on GitHub runner..."

          keytool -genkeypair \
            -keystore android/app/aurenza-upload-key.jks \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=AURENZA, OU=Engineering, O=AURENZA, L=Benin City, ST=Edo, C=NG"

          test -s android/app/aurenza-upload-key.jks

          echo "Keystore generated successfully."

      - name: Build release APK
        run: |
          flutter clean
          flutter pub get

          flutter build apk \
            --release \
            --build-number=${{ github.run_number }}

      - name: Sign release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name apksigner \
            | sort -V \
            | tail -n 1)

          test -x "$APKSIGNER"

          "$APKSIGNER" sign \
            --ks android/app/aurenza-upload-key.jks \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass "pass:$SIGNING_STORE_PASSWORD" \
            --key-pass "pass:$SIGNING_KEY_PASSWORD" \
            --out "$APK.signed" \
            "$APK"

          mv "$APK.signed" "$APK"

          "$APKSIGNER" verify --verbose "$APK"

      - name: Prepare release artifacts
        run: |
          mkdir -p release

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            release/AURENZA-BROKER-release.apk

          sha256sum \
            release/AURENZA-BROKER-release.apk \
            > release/AURENZA-BROKER-release.apk.sha256

          ls -lh release/

          cat release/AURENZA-BROKER-release.apk.sha256

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: AURENZA-BROKER-release
          path: release/AURENZA-BROKER-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload SHA256
        uses: actions/upload-artifact@v4
        with:
          name: AURENZA-BROKER-release-sha256
          path: release/AURENZA-BROKER-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup signing files
        if: always()
        run: |
          rm -f android/app/aurenza-upload-key.jks
          rm -f android/key.properties
