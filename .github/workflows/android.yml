name: Build Signed AURENZA BROKER APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/aurenza-upload-key.jks

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=aurenza-upload-key.jks
          EOF

      - name: Build Release APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --build-number=${{ github.run_number }}

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/AURENZA-BROKER-release.apk
          ls -lh release/AURENZA-BROKER-release.apk

      - name: Generate SHA256
        run: |
          cd release
          sha256sum AURENZA-BROKER-release.apk > AURENZA-BROKER-release.apk.sha256
          cat AURENZA-BROKER-release.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AURENZA-BROKER-release
          path: release/AURENZA-BROKER-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload SHA256
        uses: actions/upload-artifact@v4
        with:
          name: AURENZA-BROKER-release-sha256
          path: release/AURENZA-BROKER-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup signing files
        if: always()
        run: |
          rm -f android/key.properties
          rm -f android/app/aurenza-upload-key.jks
