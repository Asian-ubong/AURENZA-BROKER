name: AURENZA BROKER Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Signed AURENZA BROKER APK
    runs-on: ubuntu-latest

    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

    steps:
      - name: Checkout AURENZA
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Android platform files
        run: |
          if [ ! -d android ]; then
            flutter create \
              --platforms=android \
              --project-name=aurenza_broker \
              --org=com.aurenza \
              .
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Format Dart source
        run: dart format lib test

      - name: Analyze Dart source
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Prepare Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64" || {
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          }

          test -n "$KEYSTORE_PASSWORD" || {
            echo "ERROR: KEYSTORE_PASSWORD secret is missing."
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "ERROR: KEY_PASSWORD secret is missing."
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "ERROR: KEY_ALIAS secret is missing."
            exit 1
          }

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/aurenza-upload-key.jks

          test -s android/app/aurenza-upload-key.jks

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=aurenza-upload-key.jks
          EOF

      - name: Configure release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()

          header = """import java.io.FileInputStream
          import java.util.Properties

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")

          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          """

          if "val keystoreProperties = Properties()" not in text:
              text = header + text

          signing_config = """
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String?
                      keyPassword = keystoreProperties["keyPassword"] as String?
                      storeFile = keystoreProperties["storeFile"]?.let { file(it) }
                      storePassword = keystoreProperties["storePassword"] as String?
                  }
              }
          """

          if 'create("release")' not in text:
              marker = "    buildTypes {"

              if marker not in text:
                  raise SystemExit(
                      "Could not locate buildTypes in android/app/build.gradle.kts"
                  )

              text = text.replace(
                  marker,
                  signing_config + "\n" + marker,
                  1
              )

          if 'signingConfig = signingConfigs.getByName("release")' not in text:
              marker = "        release {"

              if marker not in text:
                  raise SystemExit(
                      "Could not locate release build type"
                  )

              text = text.replace(
                  marker,
                  marker + '\n            signingConfig = signingConfigs.getByName("release")',
                  1
              )

          path.write_text(text)
          PY

          echo "Signing configuration:"
          grep -n -E \
            "keystoreProperties|signingConfigs|signingConfig" \
            android/app/build.gradle.kts

      - name: Build signed release APK
        run: |
          flutter build apk \
            --release \
            --build-name=1.0.0 \
            --build-number=${{ github.run_number }}

      - name: Verify release APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          mkdir -p release

          cp \
            "$APK" \
            release/AURENZA-BROKER-release.apk

          ls -lh release/AURENZA-BROKER-release.apk

      - name: Verify APK signature
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner"

          "$APKSIGNER" verify \
            --verbose \
            release/AURENZA-BROKER-release.apk

      - name: Generate SHA256
        run: |
          cd release

          sha256sum \
            AURENZA-BROKER-release.apk \
            > AURENZA-BROKER-release.apk.sha256

          cat AURENZA-BROKER-release.apk.sha256

      - name: Upload AURENZA BROKER release APK
        uses: actions/upload-artifact@v4
        with:
          name: AURENZA-BROKER-release
          path: release/AURENZA-BROKER-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload SHA256
        uses: actions/upload-artifact@v4
        with:
          name: AURENZA-BROKER-release-sha256
          path: release/AURENZA-BROKER-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup signing files
        if: always()
        run: |
          rm -f android/key.properties
          rm -f android/app/aurenza-upload-key.jks
