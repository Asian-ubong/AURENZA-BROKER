name: ORANZO ADMIN - Android Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ORANZO ADMIN Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ORANZO ADMIN
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate missing Flutter platform files
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name=oranzo_admin --org=com.oranzo .
          fi

      - name: Apply ORANZO Android identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = text.replace('android:label="oranzo_admin"', 'android:label="ORANZO ADMIN"')
          manifest.write_text(text)

          gradle = Path('android/app/build.gradle.kts')
          if gradle.exists():
              text = gradle.read_text()
              text = text.replace('namespace = "com.oranzo.oranzo_admin"', 'namespace = "com.oranzo.admin"')
              text = text.replace('applicationId = "com.oranzo.oranzo_admin"', 'applicationId = "com.oranzo.admin"')
              gradle.write_text(text)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Format verification
        run: dart format --output=none lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Verify APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload ORANZO ADMIN APK
        uses: actions/upload-artifact@v4
        with:
          name: ORANZO-ADMIN-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
