name: ORANZO ADMIN CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oranzo-admin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze and test ORANZO ADMIN
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ORANZO ADMIN
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

  web_build:
    name: Build ORANZO ADMIN web
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout ORANZO ADMIN
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release

      - name: Upload ORANZO ADMIN web build
        uses: actions/upload-artifact@v4
        with:
          name: oranzo-admin-web-build
          path: build/web
          retention-days: 7
