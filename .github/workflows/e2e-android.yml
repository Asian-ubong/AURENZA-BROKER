name: ORANZO ADMIN - Android E2E

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-e2e:
    name: Android emulator launch and E2E smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout ORANZO ADMIN
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project when missing
        run: |
          if [ ! -d android ]; then
            flutter create \
              --platforms=android \
              --project-name=oranzo_admin \
              --org=com.oranzo \
              .
          fi

      - name: Apply ORANZO Android identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = text.replace('android:label="oranzo_admin"', 'android:label="ORANZO ADMIN"')
          manifest.write_text(text)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Static checks
        run: |
          dart format --output=none lib test integration_test
          flutter analyze
          flutter test

      - name: Run on real Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: flutter test integration_test/app_e2e_test.dart -d emulator-5554

      - name: Record Android runtime environment
        if: always()
        run: |
          flutter --version
          adb devices -l || true
          adb logcat -d -t 250 | grep -Ei 'FATAL EXCEPTION|AndroidRuntime|oranzo|flutter' || true
